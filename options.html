<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweet Media Tools</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f1419; --line: #eff3f4; --accent: #1d9bf0; --hover: #f7f9f9;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15202b; --fg: #e7e9ea; --line: #38444d; --hover: #1e2732; }
    }
    body {
      margin: 0; padding: 16px; min-width: 260px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label {
      display: flex; gap: 10px; align-items: center; padding: 10px;
      border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-weight: 600;
    }
    label:hover { background: var(--hover); }
    input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
  </style>
</head>
<body>
  <h1>When copying or sharing</h1>
  <form id="form">
    <label><input type="checkbox" name="autoLike">Like</label>
    <label><input type="checkbox" name="autoBookmark">Bookmark</label>
  </form>
  <script src="options.js"></script>
</body>
</html>
