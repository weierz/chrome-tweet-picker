<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweet Media Tools</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f1419; --muted: #536471; --line: #eff3f4;
      --accent: #1d9bf0; --hover: #f7f9f9;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15202b; --fg: #e7e9ea; --muted: #8b98a5; --line: #38444d; --hover: #1e2732; }
    }
    body {
      margin: 0; padding: 16px; min-width: 320px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label {
      display: flex; gap: 10px; align-items: center; padding: 10px;
      border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer;
    }
    label:hover { background: var(--hover); }
    input { margin: 0; accent-color: var(--accent); }
    .t { font-weight: 600; }
    #saved { color: var(--accent); font-size: 13px; height: 18px; }
  </style>
</head>
<body>
  <h1>Share tweet button</h1>
  <form id="form">
    <label><input type="radio" name="shareMode" value="image"><span class="t">Copy image</span></label>
    <label><input type="radio" name="shareMode" value="imageLink"><span class="t">Copy image + link</span></label>
  </form>
  <div id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
