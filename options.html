<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweet Media Tools</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f1419; --muted: #536471; --line: #eff3f4;
      --accent: #1d9bf0; --hover: #f7f9f9;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15202b; --fg: #e7e9ea; --muted: #8b98a5; --line: #38444d; --hover: #1e2732; }
    }
    body {
      margin: 0; padding: 16px; min-width: 320px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { margin: 0 0 12px; color: var(--muted); }
    label {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px;
      border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer;
    }
    label:hover { background: var(--hover); }
    input { margin-top: 2px; accent-color: var(--accent); }
    .t { font-weight: 600; }
    .d { color: var(--muted); font-size: 13px; }
    #saved { color: var(--accent); font-size: 13px; height: 18px; }
  </style>
</head>
<body>
  <h1>Share tweet button</h1>
  <p class="sub">What happens when you click the share icon on a tweet.</p>
  <form id="form">
    <label>
      <input type="radio" name="shareMode" value="image">
      <span><span class="t">Copy image</span><br>
      <span class="d">Copies a screenshot of the tweet.</span></span>
    </label>
    <label>
      <input type="radio" name="shareMode" value="imageLink">
      <span><span class="t">Copy image + link</span><br>
      <span class="d">Copies the screenshot and the tweet link together. Rich editors (Gmail, Notion, Docs) paste both; most chat apps paste only the image.</span></span>
    </label>
    <label>
      <input type="radio" name="shareMode" value="link">
      <span><span class="t">Copy link</span><br>
      <span class="d">Copies just the tweet URL.</span></span>
    </label>
    <label>
      <input type="radio" name="shareMode" value="shareSheet">
      <span><span class="t">System share sheet</span><br>
      <span class="d">Opens your OS share menu (Messages, Mail, AirDrop…) with the image and link. Falls back to “Copy image + link” where unsupported.</span></span>
    </label>
  </form>
  <div id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
